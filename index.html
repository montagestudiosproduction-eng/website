<!DOCTYPE html>
<html>

<head>
<title>Montage Studios</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

@keyframes fadeUp {

from {
opacity:0;
transform:translateY(40px);
}

to {
opacity:1;
transform:translateY(0);
}

}

</style>

</head>

<body style="
margin:0;
overflow-x:hidden;
font-family:Poppins;
background:black;
color:white;
">
<nav style="
position:fixed;
top:0;
left:0;
width:100%;
padding:28px 60px;
display:flex;
justify-content:space-between;
align-items:center;
box-sizing:border-box;
z-index:999;
  backdrop-filter:blur(14px);
background:rgba(0,0,0,0.15);
border-bottom:1px solid rgba(255,255,255,0.08);
">

<div style="
font-size:20px;
font-weight:700;
letter-spacing:-1px;
">

Montage®

</div>

<div style="
display:flex;
gap:40px;
font-size:14px;
text-transform:uppercase;
letter-spacing:2px;
opacity:0.8;
">

<div>Work</div>
<div>Services</div>
<div>Contact</div>

</div>

</nav>
<video autoplay muted loop playsinline style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
opacity:0.35;
z-index:-2;
">

<source src="bg.mp4" type="video/mp4">

</video>

<div style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
z-index:-1;
">
</div>

<div style="
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
position:relative;
z-index:1;

animation:fadeUp 1.5s ease;
">

<h1 style="
font-size:clamp(60px,10vw,120px);
font-weight:700;
letter-spacing:-4px;
line-height:0.9;
margin:0;
text-shadow:0 0 40px rgba(255,255,255,0.15);
">

Montage Studios

</h1>

<p style="
font-size:clamp(18px,2vw,24px);
opacity:0.7;
margin-top:20px;
font-weight:300;
letter-spacing:2px;
text-transform:uppercase;
">

Stories that Sell.

</p>

<button

onmouseover="
this.style.background='white';
this.style.color='black';
this.style.borderColor='white';
"

onmouseout="
this.style.background='rgba(255,255,255,0.08)';
this.style.color='white';
this.style.borderColor='rgba(255,255,255,0.3)';
"

style="
margin-top:40px;
padding:16px 38px;
border:1px solid rgba(255,255,255,0.3);
border-radius:999px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
color:white;
font-size:16px;
font-family:Poppins;
cursor:pointer;

transition:
background 0.6s ease,
color 0.6s ease,
border-color 0.6s ease,
box-shadow 0.6s ease;

box-shadow:
0 0 30px rgba(255,255,255,0.05);
">

View Work

</button>

</div>

<section style="
min-height:100vh;
background:white;
color:black;
padding:120px 10%;
display:flex;
flex-direction:column;
justify-content:center;
position:relative;
z-index:2;
">

<h2 style="
font-size:14px;
letter-spacing:4px;
opacity:0.5;
text-transform:uppercase;
margin-bottom:20px;
">

Selected Work

</h2>

<h3 style="
font-size:clamp(40px,6vw,80px);
line-height:1;
margin:0;
max-width:800px;
">

Crafting cinematic visuals for modern brands.

</h3>
<div style="
margin-top:80px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:30px;
">

<div style="
height:420px;
border-radius:30px;
overflow:hidden;
position:relative;
background:black;
cursor:pointer;
">

<img src='https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1200&auto=format&fit=crop'
style='
width:100%;
height:100%;
object-fit:cover;
transition:0.8s ease;
opacity:0.85;
'
>

<div style="
position:absolute;
bottom:30px;
left:30px;
color:white;
">

<div style="
font-size:14px;
letter-spacing:3px;
opacity:0.7;
text-transform:uppercase;
margin-bottom:10px;
">
Commercial
</div>

<div style="
font-size:34px;
font-weight:700;
line-height:1;
max-width:250px;
">
Luxury Brand Campaign
</div>

</div>

</div>

<div style="
height:420px;
border-radius:30px;
overflow:hidden;
position:relative;
background:black;
cursor:pointer;
">

<img src='https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop'
style='
width:100%;
height:100%;
object-fit:cover;
transition:0.8s ease;
opacity:0.85;
'
>

<div style="
position:absolute;
bottom:30px;
left:30px;
color:white;
">

<div style="
font-size:14px;
letter-spacing:3px;
opacity:0.7;
text-transform:uppercase;
margin-bottom:10px;
">
Social Media
</div>

<div style="
font-size:34px;
font-weight:700;
line-height:1;
max-width:250px;
">
Cinematic Reel Production
</div>

</div>

</div>

</div>
</section>

</body>
</html>
