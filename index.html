<!DOCTYPE html>
<html>

<head>
<title>Montage Studios</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body style="
margin:0;
overflow:hidden;
font-family:Poppins;
background:black;
">

<video autoplay muted loop playsinline style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
opacity:0.45;
z-index:-2;
">

<source src="bg.mp4" type="video/mp4">

</video>

<div style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
z-index:-1;
">
</div>

<div style="
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
color:white;
">

<h1 style="
font-size:90px;
margin:0;
">
Montage Studios
</h1>

<p style="
font-size:24px;
opacity:0.7;
">
Stories that Sell.
</p>

<button

onmouseover="
this.style.background='white';
this.style.color='black';
"

onmouseout="
this.style.background='rgba(255,255,255,0.08)';
this.style.color='white';
"

style="
margin-top:40px;
padding:16px 38px;
border:1px solid rgba(255,255,255,0.3);
border-radius:999px;
background:rgba(255,255,255,0.08);
color:white;
font-size:16px;
font-family:Poppins;
cursor:pointer;
transition:0.6s ease;
">

View Work

</button>

</div>

</body>
</html>
